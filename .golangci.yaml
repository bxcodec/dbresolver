version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 140
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - mnd
          - revive
        path: _test\.go
      - path: db_test.go
        text: 'deferInLoop: Possible resource leak, ''defer'' is called in the ''for'' loop'
      - path: \.go
        text: 'commentedOutCode: may want to remove commented-out code'
      - path: \.go
        text: 'commentFormatting: put a space between `//` and comment text'
      - linters:
          - whitespace
        path: _test.go
        text: unnecessary (leading|trailing) newline
      - linters:
          - errcheck
          - funlen
          - goconst
          - gocritic
          - gocyclo
          - govet
        path: db_test.go
      - linters:
          - errcheck
          - funlen
          - goconst
          - gocritic
          - gocyclo
          - govet
        path: fuzz_test.go
      - path: \.go
        text: 'G404: Use of weak random number generator'
      - path: \.go
        # modulo by an element count is bounded and always fits the target type
        text: 'G115: integer overflow conversion'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
